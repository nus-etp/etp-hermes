name: harness-prune

# Monthly prune of the self-optimising harness (docs/self-optimising-harness.md
# §7). For every ledger row older than N days, replays the active scenario
# corpus with that merged change reverted on both runtimes; a change no
# scenario needs any more gets a `harness:prune` revert PR (branch
# harness/prune-<pr>, assigned to the maintainer). The ledger's `pruned_pr`
# stamps are committed back to main so a row is proposed at most once.

on:
  schedule:
    - cron: '0 7 1 * *'   # 07:00 UTC on the 1st of each month
  workflow_dispatch:
    inputs:
      older_than_days:
        description: 'Only consider ledger rows merged at least this many days ago.'
        required: false
        default: '30'
      open_prs:
        description: 'Open harness:prune PRs for changes that bought nothing.'
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: harness-prune
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Configure git identity and prune label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh label create "harness:prune" --color BFD4F2 \
            --description "Monthly harness prune: revert a change no scenario needs" 2>/dev/null || true

      - name: Prune ledger changes
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          OLDER_THAN_DAYS: ${{ github.event.inputs.older_than_days || '30' }}
          OPEN_PRS: ${{ github.event_name == 'schedule' || github.event.inputs.open_prs == 'true' }}
        run: |
          args=(--older-than-days "${OLDER_THAN_DAYS}")
          if [ "${OPEN_PRS}" = "true" ]; then
            args+=(--open-prs)
          fi
          python3 scripts/harness/prune.py "${args[@]}"

      - name: Upload prune report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harness-prune-report-${{ github.run_id }}
          path: data/harness/prune-report.json
          if-no-files-found: ignore

      - name: Commit ledger prune stamps
        run: |
          git add signals/harness/ledger.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore(harness): stamp pruned ledger rows"
          for attempt in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            echo "push attempt ${attempt} rejected; rebasing..." >&2
            git pull --rebase origin main || { git rebase --abort; exit 1; }
          done
          exit 1

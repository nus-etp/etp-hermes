name: acra-refresh

on:
  schedule:
    - cron: '0 6 20 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: acra-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download ACRA collection and filter to the watchlist
        run: python3 scripts/acra_refresh.py

      - name: Detect watchlist changes
        id: diff
        run: |
          if git diff --quiet -- data/acra/watchlist-entities.csv data/companies.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        if: steps.diff.outputs.changed == 'true'

      - name: Validate schema
        if: steps.diff.outputs.changed == 'true'
        run: |
          uv venv
          uv pip install -e ".[dev]"
          .venv/bin/pytest tests/static -q

      - name: Open or refresh PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c acra-refresh
          git add data/acra/watchlist-entities.csv data/acra/changes.md data/companies.json
          git commit -m "chore(data): monthly ACRA watchlist refresh"
          git push -f origin acra-refresh
          if [ "$(gh pr list --head acra-refresh --state open --json number --jq length)" = "0" ]; then
            gh pr create \
              --title "chore(data): ACRA watchlist refresh ($(date -u +%Y-%m))" \
              --body-file data/acra/changes.md
          else
            gh pr edit acra-refresh --body-file data/acra/changes.md
          fi

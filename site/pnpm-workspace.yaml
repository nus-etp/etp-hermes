packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
  '@eslint/js': ^9.39.1
  '@types/node': ^24.10.4
  eslint: ^9.39.2
  prettier: ^3.7.4
  react-aria-components: 1.16.0
  typescript: ^5.9.3
  vite: 8.0.16
  zod: ^4.2.1

catalogs:
  next:
    '@next/env': 16.3.5
    '@next/eslint-plugin-next': 16.3.5
    next: 16.3.5
  oui:
    '@opengovsg/oui': 0.0.52
    '@opengovsg/oui-theme': 0.0.52
  react:
    '@types/react': ^19.2.14
    '@types/react-dom': ^19.2.3
    react: ^19.2.5
    react-dom: ^19.2.5
  tailwindcss4:
    '@tailwindcss/postcss': ^4.2.2
    tailwindcss: ^4.2.2

linkWorkspacePackages: true

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@opengovsg/*'

onlyBuiltDependencies:
  - esbuild

overrides:
  '@types/minimatch': 5.1.2
  '@img/sharp-libvips-darwin-arm64': '-'
  postcss: '>=8.5.23'
  '@babel/core': 7.29.7
  js-yaml: '>=4.3.2'
  # GHSA-3jxr-9vmj-r5cp / GHSA-mh99-v99m-4gvg / GHSA-rgw5-rvv9-x895 (brace-expansion
  # ReDoS/DoS): scoped per minimatch major so neither the eslint (minimatch@3, old
  # brace-expansion API) nor the typescript-eslint (minimatch@10, new API) chain
  # gets bumped across a brace-expansion major.
  'minimatch@3>brace-expansion': '^1.1.18'
  'minimatch@10>brace-expansion': '^5.0.12'
  # GHSA-28wg-ghj8-5hjv (nanoid infinite loop on negative size): only the
  # @opengovsg/oui chain pulls the vulnerable 5.x line; nanoid@3.3.19 elsewhere
  # is unaffected and left alone.
  '@opengovsg/oui>nanoid': '^5.1.16'
  # GHSA-c83g-rgw3-j3cx / GHSA-73wf-gq98-2v4g (browserslist unbounded cache growth /
  # prototype write via untrusted stats): single instance in the tree, patch bump.
  browserslist: '^4.28.9'

publicHoistPattern:
  - '*prettier*'
  - '*eslint-plugin*'
  - '*@opengovsg/oui*'
